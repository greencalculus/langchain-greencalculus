name: CI

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    # Weekly. Two things break this package without anyone touching it: a
    # langchain-core release changing the tool interface, and our own API
    # changing its response shape. Both are upstream, both are silent, and a
    # user hitting them first is the failure mode this job exists to prevent.
    - cron: "41 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[test]"

      # No GREENCALCULUS_API_KEY is configured, on purpose. The integration
      # suite hits the open browse route, so a green run here proves the
      # advertised no-key path actually works for a stranger.
      - name: LangChain conformance + behaviour suite
        run: pytest -q

      - name: The keyless promise in the README must hold
        run: |
          python - <<'PY'
          from langchain_greencalculus import EmissionFactorLookup
          out = EmissionFactorLookup().invoke({"key": "grid.gbr.electricity.location_based"})
          assert out.startswith("0.13096 "), out
          assert "citation:" in out and "DESNZ" in out, out
          print("keyless lookup returns a value with its citation")
          PY

  latest:
    name: Against the latest langchain-core
    runs-on: ubuntu-latest
    # Informational: an upstream release should warn us, not block our PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -e ".[test]"
          pip install --upgrade langchain-core langchain-tests
          python -c "import langchain_core; print('langchain-core', langchain_core.__version__)"
      - run: pytest -q
